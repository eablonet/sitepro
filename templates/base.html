{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TSI1{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/navigation.css' %}">
    <link rel="stylesheet" href="{% static 'css/cartes/doc-icone.css' %}">
    <link rel="stylesheet" href="{% static 'css/cartes/carte-document.css' %}">
    <link rel="stylesheet" href="{% static 'css/cartes/carte-cours.css' %}">
    <link rel="stylesheet" href="{% static 'css/cartes/carte-tp.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include 'partials/header.html' %}
    
    <main class="container site-main">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'partials/footer.html' %}

    <script src="{% static 'js/nav.js' %}" defer></script>
</body>
</html>
