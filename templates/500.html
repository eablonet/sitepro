<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur</title>
    <style>
        body {
            background: #F4F6F4;
            color: #4A5E4A;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .erreur {
            text-align: center;
            max-width: 480px;
        }
        .erreur__code {
            font-size: 48px;
            font-weight: 500;
            color: #B0C4B0;
            margin: 0 0 8px;
        }
        h1 {
            font-size: 24px;
            color: #1E2E1E;
            margin: 0 0 12px;
        }
        p {
            line-height: 1.7;
            margin: 0 0 24px;
        }
        a {
            color: #2E7D52;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="erreur">
        <p class="erreur__code">500</p>
        <h1>Erreur serveur</h1>
        <p>
            Une erreur inattendue s'est produite. Le problème a été enregistré
            et sera corrigé dès que possible. Merci de réessayer dans quelques instants.
        </p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
